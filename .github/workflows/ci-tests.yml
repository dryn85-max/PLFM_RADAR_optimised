name: AERIS-10 CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ===========================================================================
  # Python: lint (ruff), syntax check (py_compile), unit tests (pytest)
  # CI structure proposed by hcm444 — uses uv for dependency management
  # ===========================================================================
  python-tests:
    name: Python Lint + Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint (whole repo)
        run: uv run ruff check .

      - name: Syntax check (py_compile)
        run: |
          uv run python - <<'PY'
          import py_compile
          from pathlib import Path

          skip = {".git", "__pycache__", ".venv", "venv", "docs"}
          for p in Path(".").rglob("*.py"):
              if skip & set(p.parts):
                  continue
              py_compile.compile(str(p), doraise=True)
          PY

      - name: Unit tests
        run: >
          uv run pytest
          9_Firmware/9_3_GUI/test_GUI_V65_Tk.py
          9_Firmware/9_3_GUI/test_v7.py
          -v --tb=short

  # ===========================================================================
  # Legacy F7 MCU unit tests (20 tests)
  # Bug regression (15) + Gap-3 safety tests (5)
  # ===========================================================================
  mcu-tests:
    name: Legacy F7 MCU tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build and run MCU tests
        run: make test
        working-directory: legacy/9_Firmware/9_1_Microcontroller/tests

  # ===========================================================================
  # FPGA RTL Regression (38 testbenches + lint + vendor-neutrality/resource gates)
  # Golden vectors under fpga/tb/golden are committed; the
  # generators (numpy) are re-run here to make sure they still reproduce them.
  # ===========================================================================
  fpga-regression:
    name: FPGA Regression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Regenerate golden vectors and check they are unchanged
        working-directory: fpga
        run: |
          uv run python tb/golden/gen_twiddle_rom.py 256
          uv run python tb/golden/gen_ref_spectrum.py
          uv run python tb/golden/gen_ddc_golden.py
          uv run python tb/golden/gen_fir_golden.py
          uv run python tb/golden/gen_fft_golden.py
          uv run python tb/golden/gen_mf_chain_golden.py
          uv run python tb/golden/gen_fullchain_golden.py
          git diff --exit-code -- .

      - name: Run full FPGA regression
        run: bash run_regression.sh
        working-directory: fpga

      # The receiver golden compare checks against the committed
      # tb/golden/golden_doppler.mem, and golden generate writes to a scratch
      # file, so the regression must leave tb/golden untouched.
      # (tb/cosim/*.csv are rewritten by the regression and ignored here.)
      - name: Check the regression did not rewrite committed golden files
        run: git diff --exit-code -- tb/golden
        working-directory: fpga

  # ===========================================================================
  # Cross-Layer Contract Tests (Python ↔ Verilog ↔ C)
  # Validates opcode maps, bit widths, packet layouts, and round-trip
  # correctness across FPGA RTL, Python GUI, and STM32 firmware.
  # ===========================================================================
  cross-layer-tests:
    name: Cross-Layer Contract Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run cross-layer contract tests
        run: >
          uv run pytest
          9_Firmware/tests/cross_layer/test_cross_layer_contract.py
          -v --tb=short

  # ===========================================================================
  # STM32G0B1 firmware (firmware/): host tests + ARM cross-build
  # ===========================================================================
  mcu-g0b1:
    name: MCU G0B1 Firmware
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Host tests (ADAR_COUNT=1 and 4)
        run: make test
        working-directory: firmware

      - name: Build default (ADAR_COUNT=1, DIAG=1)
        run: make
        working-directory: firmware

      - name: Build DIAG=0
        run: make DIAG=0 clean all
        working-directory: firmware

      - name: Build ADAR_COUNT=4
        run: make ADAR_COUNT=4 clean all
        working-directory: firmware
